name: daily-run

on:
  schedule:
    # 16:30 UTC = 11:30 or 12:30 in New York: always during US market hours on trading days.
    - cron: "30 16 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline tests (stop if anything is broken)
        run: python -m unittest tests.test_bot

      - name: Daily decision on the paper account
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.run

      - name: Refresh the live view (positions and trades just placed)
        if: always()
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.live

      - name: Save the ledger and report
        if: always()
        run: |
          git config user.name "daily-run"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state 2>/dev/null || true
          git add report.md 2>/dev/null || true
          git add docs/data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily run $(date -u +%F)"
            # The live refresh may push at the same moment: replay on top of it and retry.
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs && git push -q && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
