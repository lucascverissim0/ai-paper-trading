name: daily-run

on:
  schedule:
    # GitHub often starts scheduled runs hours late (Nov 2026: 16:30 started at 23:00, market closed,
    # so no decision was made). Several tries during market hours; the first that finds the market open
    # decides, the others see "Already ran today" and stop at no cost.
    # 14:50 / 16:30 / 18:10 / 19:40 UTC are all inside US market hours in winter and in summer.
    - cron: "50 14 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "10 18 * * 1-5"
    - cron: "40 19 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The latest ledger, not the one from when the run was queued: an earlier try may have
          # decided already, and this one must see it to avoid deciding twice.
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline tests (stop if anything is broken)
        run: python -m unittest tests.test_bot

      - name: Daily decision on the paper account
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.run

      - name: Refresh the live view (positions and trades just placed)
        if: always()
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.live

      - name: Save the ledger and report
        if: always()
        run: |
          git config user.name "daily-run"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state 2>/dev/null || true
          git add report.md 2>/dev/null || true
          git add docs/data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Daily run $(date -u +%F)"
            # The live refresh may push at the same moment: replay on top of it and retry.
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs && git push -q && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
