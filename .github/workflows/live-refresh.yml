name: live-refresh

# Read-only refresh of the dashboard's live view (positions, P&L, trades, headlines).
# No order and no Claude call: it costs nothing.
on:
  schedule:
    # Every 15 minutes, 13:00-21:59 UTC on weekdays: covers US market hours in winter and summer.
    # The script does nothing when the market is closed and the closing values are already saved.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: live-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the live view
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m bot.live

      - name: Publish it
        run: |
          git config user.name "live-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/live.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Live refresh $(date -u +%FT%H:%MZ)"
            # The daily run may push at the same moment: replay on top of it and retry.
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs && git push -q && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi
