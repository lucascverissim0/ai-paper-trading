<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Trading Test</title>
<meta name="description" content="Live results of a fake-money test: does Claude beat buying and holding the S&P 500 after all costs?">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #16181d; --muted: #5f6673; --line: #e3e6eb;
    --ai: #2f6fde; --spy: #c2662d; --good: #1d8a4e; --bad: #c8343b; --warn: #a66a00;
    --bar: #e9edf3; --s_6040: #7a5cc2; --s_equal: #2b9a8f; --s_trend: #8a8f98;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --card: #191c21; --text: #eceef2; --muted: #9aa2ae; --line: #2a2f37;
      --ai: #6e9ff5; --spy: #e48b50; --good: #43c07a; --bad: #f0686e; --warn: #e2a93a;
      --bar: #262b33; --s_6040: #a68cf0; --s_equal: #4cc7b9; --s_trend: #b3b9c3;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
           border: 1px solid currentColor; margin-left: 8px; vertical-align: middle; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin: 20px 0; }
  .two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin: 12px 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .kpi .label { color: var(--muted); font-size: 13px; }
  .kpi .value { font-size: 24px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .note { color: var(--muted); font-size: 13px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .verdict { font-size: 17px; font-weight: 600; margin: 16px 0 0; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  svg text { fill: var(--muted); font-size: 11px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line);
         font-variant-numeric: tabular-nums; }
  .row:last-child { border-bottom: 0; }
  .barwrap { background: var(--bar); border-radius: 6px; height: 8px; overflow: hidden; margin-top: 4px; }
  .barwrap div { height: 100%; background: var(--ai); }
  .table { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.num, th.num { text-align: right; }
  .log { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .log:last-child { border-bottom: 0; }
  .log .meta { font-size: 13px; color: var(--muted); }
  button { background: transparent; color: var(--ai); border: 1px solid var(--line); border-radius: 8px;
           padding: 6px 12px; font: inherit; cursor: pointer; margin-top: 10px; }
  .foot { color: var(--muted); font-size: 13px; margin-top: 24px; }
  .rel { position: relative; } .mt { margin-top: 12px; } .mb { margin-bottom: 8px; } .row.flat { border: 0; padding: 0; }
  .sw-ai { background: var(--ai); } .sw-spy { background: var(--spy); } .light { opacity: .5; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; }
  .sw-s_6040 { background: var(--s_6040); } .sw-s_equal { background: var(--s_equal); } .sw-s_trend { background: var(--s_trend); }
  details { margin-top: 6px; font-size: 14px; } summary { cursor: pointer; color: var(--ai); }
  .pre { white-space: pre-wrap; color: var(--muted); margin: 6px 0 0; }
  .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line);
         border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
</style>
</head>
<body>
<main id="root"><p class="sub">Loading...</p></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const REFRESH_MS = 5 * 60 * 1000;

const usd = (x, sign = false) => {
  const s = Math.abs(x).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (x < 0 ? "-" : sign && x > 0 ? "+" : "") + "$" + s;
};
const pct = (x, digits = 2) => (x > 0 ? "+" : "") + (x * 100).toFixed(digits) + "%";
const tone = (x) => (x > 0 ? "good" : x < 0 ? "bad" : "");

const STATUS = {
  ok: ["Decided", ""],
  halted: ["Test stopped", "bad"],
  budget_reached: ["API budget reached, held", "warn"],
  api_error: ["Claude unreachable, held", "warn"],
  refused: ["No answer, held", "warn"],
  truncated: ["Answer cut off, held", "warn"],
  bad_output: ["Unreadable answer, held", "warn"],
  no_data: ["No price data, held", "warn"],
  waiting: ["Waiting for its review date (no cost)", "sub"],
  no_consensus: ["Too few usable answers, held", "warn"],
};
const SHADOW_KEYS = ["s_6040", "s_equal", "s_trend"];

function Kpi({ label, value, note, cls }) {
  return html`<div class="card kpi">
    <div class="label">${label}</div>
    <div class=${"value " + (cls || "")}>${value}</div>
    ${note && html`<div class="note">${note}</div>`}
  </div>`;
}

function Chart({ series, capital, labels }) {
  const [hover, setHover] = useState(null);
  const ref = useRef(null);
  const W = 720, H = 260, L = 64, R = 12, T = 10, B = 28;
  const keys = [["ai_after_costs", "var(--ai)", false], ["spy_after_costs", "var(--spy)", false],
                ["ai_before_costs", "var(--ai)", true]]
    .concat(SHADOW_KEYS.map((k) => [k, "var(--" + k + ")", false, true]));
  const has = (v) => typeof v === "number";
  const values = series.flatMap((p) => keys.map(([k]) => p[k])).filter(has).concat([capital]);
  let lo = Math.min(...values), hi = Math.max(...values);
  const pad = Math.max((hi - lo) * 0.1, capital * 0.01);
  lo -= pad; hi += pad;
  const n = series.length;
  const x = (i) => (n === 1 ? (L + W - R) / 2 : L + (i * (W - L - R)) / (n - 1));
  const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
  const ticks = [0, 1, 2, 3].map((i) => lo + ((hi - lo) * i) / 3);

  const onMove = (e) => {
    const box = ref.current.getBoundingClientRect();
    const px = ((e.clientX - box.left) / box.width) * W;
    let best = 0;
    series.forEach((_, i) => { if (Math.abs(x(i) - px) < Math.abs(x(best) - px)) best = i; });
    setHover({ i: best, left: e.clientX - box.left, top: e.clientY - box.top });
  };

  const p = hover && series[hover.i];
  return html`<div class="rel">
    <svg ref=${ref} viewBox=${`0 0 ${W} ${H}`} width="100%" role="img"
         aria-label="Value of the AI portfolio and of buy-and-hold SPY over time"
         onMouseMove=${onMove} onMouseLeave=${() => setHover(null)}>
      ${ticks.map((t) => html`<g key=${t}>
        <line x1=${L} x2=${W - R} y1=${y(t)} y2=${y(t)} stroke="var(--line)" />
        <text x=${L - 8} y=${y(t) + 4} text-anchor="end">${usd(t).replace(".00", "")}</text></g>`)}
      <line x1=${L} x2=${W - R} y1=${y(capital)} y2=${y(capital)} stroke="var(--muted)" stroke-dasharray="2 4" />
      ${keys.map(([k, color, dashed, thin]) => n === 1
        ? has(series[0][k]) && html`<circle key=${k} cx=${x(0)} cy=${y(series[0][k])} r=${thin ? 3 : 4} fill=${color} opacity=${dashed ? 0.5 : 1} />`
        : html`<polyline key=${k} fill="none" stroke=${color} stroke-width=${dashed || thin ? 1.5 : 2.5}
                stroke-dasharray=${dashed ? "5 5" : ""} opacity=${dashed ? 0.6 : thin ? 0.8 : 1}
                points=${series.map((pt, i) => has(pt[k]) ? `${x(i)},${y(pt[k])}` : "").filter(Boolean).join(" ")} />`)}
      <text x=${L} y=${H - 6}>${series[0].date}</text>
      ${n > 1 && html`<text x=${W - R} y=${H - 6} text-anchor="end">${series[n - 1].date}</text>`}
      ${hover && html`<line x1=${x(hover.i)} x2=${x(hover.i)} y1=${T} y2=${H - B} stroke="var(--muted)" />`}
    </svg>
    ${p && html`<div class="tip" style=${{ left: Math.min(hover.left + 12, 520) + "px", top: hover.top + 12 + "px" }}>
      <b>${p.date}</b><br/>
      AI after costs: ${usd(p.ai_after_costs)}<br/>
      SPY buy-and-hold: ${usd(p.spy_after_costs)}<br/>
      <span class="sub">AI before costs: ${usd(p.ai_before_costs)}</span>
      ${SHADOW_KEYS.filter((k) => has(p[k])).map((k) => html`<br key=${k + "b"}/><span key=${k} class="sub">${labels[k]}: ${usd(p[k])}</span>`)}
    </div>`}
  </div>`;
}

function Dashboard({ d }) {
  const s = d.summary, cfg = d.settings, cap = cfg.real_capital_usd;
  const [allTrades, setAllTrades] = useState(false);
  const [allLog, setAllLog] = useState(false);
  const budgetUsed = Math.min(1, s.api_cost / cfg.api_budget_usd);
  const trades = allTrades ? d.trades : d.trades.slice(0, 15);
  const log = allLog ? d.log : d.log.slice(0, 10);
  const holdings = Object.entries(d.holdings || {}).filter(([, w]) => w > 0).sort((a, b) => b[1] - a[1]);
  const cash = Math.max(0, 1 - holdings.reduce((t, [, w]) => t + w, 0));
  const labels = d.shadow_labels || {};
  const split = d.api_cost_split || {};
  const compare = [["AI (Claude), after fees and API", s.strat_net_usd, "sw-ai"], ["Buy and hold SPY", s.bench_net_usd, "sw-spy"]]
    .concat(SHADOW_KEYS.filter((k) => s.shadows && k in s.shadows).map((k) => [labels[k], s.shadows[k], "sw-" + k]))
    .sort((a, b) => b[1] - a[1]);

  return html`<div>
    <h1>AI trading test
      <span class=${"badge " + (d.status === "running" ? "good" : "bad")}>${d.status === "running" ? "Running" : "Stopped"}</span></h1>
    <p class="sub">Fake money only. Claude (${cfg.model}) reads prices, economic data and the news, then chooses its own next review (1 to 10 trading days, sooner if markets jolt); each decision is the median of 3 independent answers. Results restated as if ${usd(cap).replace(".00", "")} were invested, after every cost. Started ${d.start_date}; last update ${d.updated_at}.</p>
    ${d.halt_reason && html`<p class="bad">Stopped: ${d.halt_reason}</p>`}
    <p class=${"verdict " + tone(s.edge_usd)}>
      The AI is ${s.edge_usd >= 0 ? "ahead of" : "behind"} simply holding SPY by ${usd(Math.abs(s.edge_usd))} after all costs.</p>

    <div class="grid">
      <${Kpi} label="AI result after all costs" value=${usd(s.strat_net_usd, true)} cls=${tone(s.strat_net_usd)}
              note=${pct(s.strat_net_usd / cap) + " on " + usd(cap).replace(".00", "")} />
      <${Kpi} label="SPY buy-and-hold" value=${usd(s.bench_net_usd, true)} cls=${tone(s.bench_net_usd)}
              note=${pct(s.bench_net_usd / cap) + " after its one purchase fee"} />
      <${Kpi} label="AI before costs" value=${pct(s.gross_return)} note=${"SPY " + pct(s.bench_return)} />
      <${Kpi} label="Worst fall from a peak" value=${pct(-s.strat_drawdown)}
              note=${"SPY " + pct(-s.bench_drawdown) + "; stops at -" + (cfg.max_drawdown * 100) + "%"} />
      <${Kpi} label="Days / AI decisions" value=${s.days_elapsed + " / " + s.decisions} note="calendar days since start" />
      <${Kpi} label="Next review chosen by the AI" value=${s.next_review || "-"} note="earlier if markets jolt" />
    </div>

    <div class="card">
      <h2>Value of ${usd(cap).replace(".00", "")} over time</h2>
      <div class="legend">
        <span><i class="sw-ai"></i>AI after costs</span>
        <span><i class="sw-spy"></i>SPY buy-and-hold</span>
        <span><i class="sw-ai light"></i>AI before costs (dashed)</span>
        ${SHADOW_KEYS.map((k) => html`<span key=${k}><i class=${"sw-" + k}></i>${labels[k] || k}</span>`)}
      </div>
      <${Chart} series=${d.series} capital=${cap} labels=${labels} />
    </div>

    <div class="card mt">
      <h2>Ranking: AI against simple rules (same days, prices and fees)</h2>
      ${compare.map(([name, v, sw]) => html`<div class="row" key=${name}>
        <span><i class=${sw + " swatch"}></i>${name}</span><b class=${tone(v)}>${usd(v, true)} (${pct(v / cap)})</b></div>`)}
      <p class="sub mt">The rules cost nothing to run. If the AI cannot beat them, it adds nothing.</p>
    </div>

    <div class="two">
      <div class="card">
        <h2>Costs so far</h2>
        <div class="row"><span>Trading fees (modelled: $${cfg.fee_per_order_usd.toFixed(2)} + ${(cfg.fee_rate * 100).toFixed(1)}% per order)</span><b>${usd(s.fees_real)}</b></div>
        <div class="row"><span>Claude API (measured)</span><b>${usd(s.api_cost)}</b></div>
        <div class="row"><span class="sub">of which: news research ${usd(split.research || 0)}, web searches ${usd(split.searches || 0)}, decisions ${usd(split.decisions || 0)}</span><span></span></div>
        <div class="row"><span>Other costs</span><b>${usd(s.other_costs)}</b></div>
        <div class="row"><span>Total</span><b>${usd(s.fees_real + s.api_cost + s.other_costs)}</b></div>
        <div class="sub mt">API budget: ${usd(s.api_cost)} of ${usd(cfg.api_budget_usd)}</div>
        <div class="barwrap"><div style=${{ width: budgetUsed * 100 + "%" }}></div></div>
      </div>
      <div class="card">
        <h2>Current holdings</h2>
        ${holdings.map(([sym, w]) => html`<div key=${sym} class="mb">
          <div class="row flat"><span><b>${sym}</b> <span class="sub">${cfg.universe[sym] || ""}</span></span><span>${(w * 100).toFixed(1)}%</span></div>
          <div class="barwrap"><div style=${{ width: w * 100 + "%" }}></div></div></div>`)}
        <div class="row flat"><span><b>Cash</b></span><span>${(cash * 100).toFixed(1)}%</span></div>
        <div class="barwrap"><div style=${{ width: cash * 100 + "%", background: "var(--muted)" }}></div></div>
      </div>
    </div>

    <div class="card mt">
      <h2>Trades (${d.trades.length})</h2>
      ${d.trades.length === 0 ? html`<p class="sub">No trades yet.</p>` : html`<div class="table"><table>
        <thead><tr><th>Date</th><th>ETF</th><th>Side</th><th class="num">Amount (at ${usd(cap).replace(".00", "")})</th><th class="num">Fee</th><th>Status</th></tr></thead>
        <tbody>${trades.map((t, i) => html`<tr key=${i}>
          <td>${t.date}</td><td><b>${t.symbol}</b></td><td class=${t.side === "buy" ? "good" : "bad"}>${t.side}</td>
          <td class="num">${usd(t.amount_real_usd)}</td><td class="num">${usd(t.fee_real_usd)}</td><td>${t.status}</td></tr>`)}
        </tbody></table></div>`}
      ${d.trades.length > 15 && html`<button onClick=${() => setAllTrades(!allTrades)}>${allTrades ? "Show fewer" : "Show all trades"}</button>`}
    </div>

    <div class="card mt">
      <h2>Daily log</h2>
      ${log.map((e) => {
        const [label, cls] = STATUS[e.status] || [e.status, ""];
        const w = e.weights ? Object.entries(e.weights).filter(([, v]) => v > 0).map(([k, v]) => k + " " + Math.round(v * 100) + "%").join(", ") || "all cash" : "";
        return html`<div class="log" key=${e.date}>
          <div><b>${e.date}</b> <span class=${cls}>${label}</span></div>
          ${e.trigger && html`<div class="meta">Woken up because: ${e.trigger}</div>`}
          <div class="meta">API cost ${usd(e.api_cost_usd)}${w ? " - target: " + w : ""}${e.next_review_days ? " - next review in " + e.next_review_days + " trading day(s)" : ""}</div>
          ${e.rationale && html`<div>${e.rationale}</div>`}
          ${e.briefing && html`<details><summary>News briefing (${e.searches} web searches)</summary><p class="pre">${e.briefing}</p></details>`}
          ${e.samples && e.samples.length > 0 && html`<details><summary>The ${e.samples.length} independent answers</summary>
            ${e.samples.map((a, i) => html`<div class="pre" key=${i}>${i + 1}. ${a.status === "ok"
              ? Object.entries(a.weights).filter(([, v]) => v > 0).map(([k, v]) => k + " " + Math.round(v * 100) + "%").join(", ") + " - review in " + a.next_review_days + " - " + a.rationale
              : a.status + " " + (a.detail || "")} (${usd(a.cost_usd)})</div>`)}</details>`}
        </div>`;
      })}
      ${d.log.length > 10 && html`<button onClick=${() => setAllLog(!allLog)}>${allLog ? "Show fewer" : "Show all days"}</button>`}
    </div>

    <p class="foot">Dividends are left out on both sides. Under 12 months, a result either way can be luck. Simple rules: values after modelled fees, no API cost. The page refreshes every 5 minutes; the numbers change once per trading day, after the run at 16:30 UTC.</p>
  </div>`;
}

function App() {
  const [state, setState] = useState({ loading: true });
  useEffect(() => {
    let alive = true;
    const load = () => fetch("data/dashboard.json?t=" + Date.now(), { cache: "no-store" })
      .then((r) => { if (r.status === 404) return null; if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then((d) => alive && setState({ data: d }))
      .catch((e) => alive && setState((prev) => ({ ...prev, loading: false, error: e.message })));
    load();
    const id = setInterval(load, REFRESH_MS);
    return () => { alive = false; clearInterval(id); };
  }, []);

  if (state.loading) return html`<p class="sub">Loading...</p>`;
  if (state.data) return html`<${Dashboard} d=${state.data} />`;
  if (state.error) return html`<div><h1>AI trading test</h1><p class="bad">Could not load the data (${state.error}). It will retry in 5 minutes.</p></div>`;
  return html`<div><h1>AI trading test</h1>
    <p class="sub">No results yet. The first decision happens at the next run during US market hours (16:30 UTC on trading days).</p></div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
